# The house character.
#
# What a project with no `character` key in ../../config/projects.toml resolves
# to, and what the main tab shows — the main tab belongs to no project, so it
# gets this one. There is no built-in face in the binary: if this file is
# missing, the app says so rather than inventing a character (D9).
#
# Keys, all optional:
#   display          what a human reads; defaults to the filename
#   voice            a Voicebox voice id — pick it in Settings, not by hand
#   palette.accent   the character's signal colour: stage, tab pill, focus ring
#   palette.glow     the halo behind the sprite while it speaks
#   palette.field    the wash the stage sits on
#   sprite.kind      procedural | frames | layered
#
# A character accents the instrument; it does not repaint it. Surfaces, lines
# and ink stay the cockpit tokens in src/ui/styles/index.css, so no profile can
# theme the app into unreadability.
#
# An absent colour means "not themed on that axis" — the app's own colour is
# used. A colour that is present and malformed is an error, because a typo that
# renders as unthemed is indistinguishable from having meant it.
#
# See ../parts_spec.md for what a layered part set must contain, and
# hud/SOURCE.md for how this one was made.

display = "HUD"

[palette]
accent = "#6ee7ff"
glow   = "#1e6f85"
field  = "#0a0d17"

[sprite]
kind = "layered"
dir  = "hud"

# Where the eyes and mouth are drawn — they are deliberately *not* in the
# artwork, so a blink and a spoken syllable are continuous rather than a swap
# between two frames. Fractions of the part canvas, so regenerating this
# character at another resolution needs no re-measuring.
#
# Measured off hud/reference.png: eyes at (321,539) and (518,539) on 832x1216.
# The mouth is an addition — the reference has none, and for a visor-faced
# character the mouth belongs on the screen.
[sprite.face]
eyes    = [[0.386, 0.443], [0.623, 0.443]]
eye_r   = [0.041, 0.040]
mouth   = [0.505, 0.500]
mouth_r = [0.052, 0.022]
ink     = "#2c7f86"

# What rotates about what. The head turns at the neck; the antenna pivots where
# its stalk meets the dome, which is what lets it lag behind on a spring.
[sprite.pivot]
head    = [0.500, 0.599]
antenna = [0.487, 0.232]

# How HUD carries itself. The same code and different numbers is what makes a
# calm character and a jittery one two characters rather than two renderers —
# edit these and watch it change (D8, and the spirit of D20's lexicon).
#
#   idle           breathing depth, 0-1
#   bob            head movement while speaking, 0-1
#   lean           how far it leans in when attending, 0-1
#   blink_seconds  average gap between blinks; smaller is twitchier
#   spring         secondary-motion stiffness, 0-1; low is floppy
#
# HUD is an instrument: composed, attentive, not fidgety. The antenna is the one
# loose thing about it, so the spring is soft.
[temperament]
idle          = 0.45
bob           = 0.55
lean          = 0.5
blink_seconds = 7.0
spring        = 0.28
