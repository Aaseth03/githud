# MIA — the vault's character (D5).
#
# The second profile exists so M7's validation has something to be: two
# projects, two characters, two voices, visibly distinct rooms. Violet against
# the house cyan, and a different face, so the room is legible from the tab
# strip before you enter it.
#
# `voice` is left unset on purpose. A character is allowed to be a look without
# being a voice, and picking one belongs in Settings against Voicebox's own
# profiles list rather than in a hand-written id that may not exist on this
# machine.

display = "MIA"

[palette]
accent = "#a78bfa"
glow   = "#4c2f96"
field  = "#120a24"

[sprite]
kind  = "procedural"
eyes  = "wide"
mouth = "round"
