# Per-project overrides. Committed and synced (D8).
#
# THIS IS NOT A PROJECT LIST. The registry is scanned, not declared (D10) — the
# app walks ~/github to depth 3 and finds projects by their .git directory. Only
# things the scan cannot know, or gets wrong, are declared here.
#
# A file that starts accumulating discovered projects has become a second source
# of truth. That is a bug, not a convenience.
#
# An entry naming a repo that is not on this machine is ignored, not an error —
# this file syncs across machines, so that is the normal case.
#
# Keys, all optional:
#   kind       own | external | deprecated   (D18) — see below
#   agent      read-write | read-only        — defaults from `kind`
#   note       why this override exists; shown in the UI
#   name       display name, when the folder name is not what you want to read
#   adapter    preferred harness — the machine still decides what actually runs
#   model      preferred model for that adapter
#   character  a profile name from ../characters/profiles/ (D9, D23)
#   hidden     true to keep a scanned repo out of the sidebar
#
# The table key is the repo path relative to ~/github. Quote it if it nests:
#   [projects."some-folder/nested-repo"]
#
# ── kind ──────────────────────────────────────────────────────────────────────
#
#   own         Yours. The default; needs no entry. ICM is expected, so a
#               missing Layer 0 or Layer 1 is badged.
#   external    Third-party. Present because the work needs it, never authored
#               here. Never ICM-badged. Agent defaults to read-only.
#   deprecated  Yours, but superseded. Kept, not developed. Never badged.
#
# Detection is unaffected: GIT HUD still records what is actually on disk for
# every repo, because config/contracts/icm.md is canonical and must never be
# made to lie. `kind` only decides whether a missing layer is worth *flagging*.

[projects.voicebox]
kind  = "external"
agent = "read-only"
note  = "MIT, third-party. Used and updated, not authored. A real fix belongs in the project that consumes it — Professor or GIT HUD — not here."

[projects.AI-Dashboard]
kind = "deprecated"
note = "Superseded by GIT HUD. Kept for reference; not developed."

[projects.githud]
character = "hud"
note = "GIT HUD's own persona. Every other project resolves to `default` until it picks one."
background = "githud.jpg"
accent = "#692323"

[projects.HOME_AI_VAULT]
character = "mia"
note = "The vault. MIA is its character (D5)."

[projects.Professor]
accent = "#174920"
background = "Professor.jpg"
